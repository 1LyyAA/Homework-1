apiVersion: v1
kind: Pod
metadata:
  name: app-test-pod
  namespace: default
spec:
  containers:
  - name: app
    image: example-app:latest
    imagePullPolicy: Never
    ports:
    - containerPort: 8080
    volumeMounts:
    - name: logs
      mountPath: /app/logs
    - name: config
      mountPath: /app/config
  volumes:
  - name: logs
    emptyDir: {}
  - name: config
    configMap:
      name: app-config
